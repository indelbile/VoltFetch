name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/voltfetch-release.jks"
            echo "VOLTFETCH_KEYSTORE=$RUNNER_TEMP/voltfetch-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - the APK will be signed with a throwaway debug key."
          fi

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build
        env:
          VOLTFETCH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VOLTFETCH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VOLTFETCH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          # one APK per ABI plus a universal one, e.g. VoltFetch-1.2.0-arm64-v8a.apk
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -E 's/^app-(.*)-release(-unsigned)?$/\1/')
            cp "$f" "out/VoltFetch-${VERSION_NAME:-dev}-${abi}.apk"
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: VoltFetch-apk
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
